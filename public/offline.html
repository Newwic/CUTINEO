<!doctype html>
<html lang="th">

    <title>CUTINEO — ออฟไลน์</title>
    <style>

  </head>
  <body>
    <main>
      <img src="./assets/logo-neo.png" alt="CUTINEO" width="72" height="72" />
      <h1>คุณออฟไลน์อยู่</h1>
      <p>ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง ข้อมูล Inbox จะไม่ถูกแสดงจาก cache เพื่อความปลอดภัย</p>
    </main>
  </body>
